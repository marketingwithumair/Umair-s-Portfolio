<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12"/>
  
  <!-- Subtle Decorative Accent Ring -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="4"/>
  
  <!-- Monogram UZ Text -->
  <text x="50%" y="54%" 
        dominant-baseline="central" 
        text-anchor="middle" 
        fill="url(#text-grad)" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
        font-size="220" 
        font-weight="900" 
        letter-spacing="-8"
        filter="url(#glow)">UZ</text>
        
  <!-- Subtle Dot Accent -->
  <circle cx="400" cy="370" r="18" fill="#38bdf8"/>
</svg>
