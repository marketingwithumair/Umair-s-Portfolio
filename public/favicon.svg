<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main U & Z Ribbon Gradient -->
    <linearGradient id="uzGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Accent Growth Arrow Gradient -->
    <linearGradient id="uzGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Background Badge Gradient -->
    <linearGradient id="uzBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="uzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge Container -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="24"
    fill="url(#uzBgDark)"
    stroke="#38BDF8"
    stroke-width="2.5"
    stroke-opacity="0.4"
    filter="url(#uzGlow)"
  />

  <!-- Inner Subtle Ring Frame -->
  <rect
    x="8"
    y="8"
    width="84"
    height="84"
    rx="20"
    fill="none"
    stroke="url(#uzGradPrimary)"
    stroke-width="1"
    stroke-opacity="0.2"
  />

  <!-- Clean, Bold 'U' and 'Z' Monogram Text / Geometry -->
  <text
    x="33"
    y="63"
    fill="url(#uzGradPrimary)"
    font-size="42"
    font-weight="900"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="-1"
    text-anchor="middle"
  >U</text>

  <text
    x="66"
    y="63"
    fill="url(#uzGradAccent)"
    font-size="42"
    font-weight="900"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="-1"
    text-anchor="middle"
  >Z</text>
</svg>
